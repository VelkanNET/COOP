</style></head><body><canvas id="fx"></canvas><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const SE='negocios.wagnermarques@gmail.com',SH='c4cf517f4cd82062f2b890204d6cbb3ecbc3b9646fbac35af456148749581b5b',SID=Date.now();

ok:'<svg class="ic" viewBox="0 0 24 24"><title>Verificado</title><circle cx="12" cy="12" r="10" fill="#d4a017"/><path d="M7 12.500l3.200 3L17 9" stroke="#fff" stroke-width="2.400" fill="none"/></svg>'};
IC.home='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><title>Home</title><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>';
let S={users:[{email:SE,name:'DEV | Wagner',role:'staff',status:'ok',fr:[],sc:[]}],coops:[],posts:[]};
try{const x=JSON.parse(localStorage.getItem('coop_s2'));if(x&&x.users)S=x}catch(e){}S.tk=S.tk||[];S.log=S.log||[];S.tk.forEach(t=>{t.m=t.m||[{f:t.by,x:t.x,t:t.t}]});
let me=null,v='feed',cid=null,ch='',pe='',pt='recados',mode='login',er='',dl='',pend=null,ce=0,sp='users',sq='',tsec='',pu=null,ft='',fm='top',pubm=false,tkc='';const seen=new Set();
let PF={theme:'dark',anim:!matchMedia('(prefers-reduced-motion: reduce)').matches,col:false};
try{Object.assign(PF,JSON.parse(localStorage.getItem('coop_pf')))}catch(e){}
const sv='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
IC.sun=sv+'<title>Modo claro</title><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/></svg>';

IC.col=sv+'<title>Recolher</title><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>';
IC.exp=sv+'<title>Expandir</title><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>';
const cv=$('#fx'),cx=cv.getContext('2d');let raf=0;const bl=Array.from({length:8},()=>({x:Math.random(),y:Math.random(),r:.22+Math.random()*.25,a:Math.random()*6.28,s:2e-4+Math.random()*3e-4}));
function fx(t){const W=cv.width,H=cv.height;cx.clearRect(0,0,W,H);for(const b of bl){const x=(b.x+Math.sin(t*b.s+b.a)*.18)*W,y=(b.y+Math.cos(t*b.s*.8+b.a)*.18)*H,g=cx.createRadialGradient(x,y,0,x,y,b.r*Math.max(W,H));g.addColorStop(0,'rgba(0,220,245,.22)');g.addColorStop(1,'rgba(0,220,245,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}raf=requestAnimationFrame(fx)}
function applyPF(){document.documentElement.dataset.theme=PF.theme;cancelAnimationFrame(raf);cx.clearRect(0,0,cv.width,cv.height);if(PF.anim){cv.width=Math.ceil(innerWidth/4);cv.height=Math.ceil(innerHeight/4);raf=requestAnimationFrame(fx)}}
function setPF(k,x){PF[k]=x;try{localStorage.setItem('coop_pf',JSON.stringify(PF))}catch(e){}applyPF();render()}
addEventListener('resize',()=>{if(PF.anim)applyPF()});
const save=()=>{try{localStorage.setItem('coop_s2',JSON.stringify(S))}catch(e){}};
const U=e=>S.users.find(u=>u.email===e),C=id=>S.coops.find(c=>c.id===id),tm=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const pl=u=>u&&u.role==='staff'?PL.standard:PL[(u&&u.plan)||'free']||PL.free;
const lk=s=>/^https?:\/\//.test(s)?`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`:esc(s);
function nm(c,e){const u=U(e);let r=esc(u?u.name:e);if(u&&u.role==='staff')r=`<span class="gold">${r}</span><span class="dv">DEV</span>`+IC.wr+IC.ok;else if(u){const k=PL[u.plan]?u.plan:'free';r+=`<span class="pf ${k}">${PL[k].n}</span>`}if(c){if(c.owner===e)r+=IC.crown;else if(c.mods.includes(e))r+=IC.mod}return r}
function av(e,s=36){const u=U(e);return u&&u.pic?`<img class="av" style="width:${s}px;height:${s}px" src="${u.pic}">`:`<span class="av" style="width:${s}px;height:${s}px;font-size:${s/2.300}px">${esc((u?u.name:e)[0]).toUpperCase()}</span>`}
function img(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)}
const bad=t=>{er=t;render();return false},go=x=>{v=x;cid=null;render()},openP=e=>{pe=e;pt='recados';v='profile';cid=null;render()},openC=id=>{if(me.role==='staff'&&!C(id).members.includes(me.email))lg('Acessou o CO-OP '+C(id).name+' por chamado de suporte');cid=id;v='coop';ch=C(id).ch[0].id;render()};
const canSee=c=>c.members.includes(me.email)||(me.role==='staff'&&S.tk.some(t=>!t.d&&t.co===c.id));
const adm=c=>me.role==='staff'||c.owner===me.email||c.mods.includes(me.email);
const free=()=>me.status!=='castigo'||bad('Você está em castigo e não pode publicar ou enviar mensagens.');

const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',rs=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>B32[b%32]).join('');
function b32d(t){let b=0,x=0,o=[];for(const c of t){x=(x<<5)|B32.indexOf(c);b+=5;if(b>=8){o.push((x>>>(b-8))&255);b-=8}}return new Uint8Array(o)}
async function totp(sec){let x=Math.floor(Date.now()/30000);const m=new Uint8Array(8);for(let i=7;i>=0;i--){m[i]=x&255;x=Math.floor(x/256)}const k=await crypto.subtle.importKey('raw',b32d(sec),{name:'HMAC',hash:'SHA-1'},false,['sign']),h=new Uint8Array(await crypto.subtle.sign('HMAC',k,m)),o=h[19]&15;return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,'0')}
const cur=u=>u.h||(u.email===SE?SH:'x'),lg=x=>{S.log.push({t:Date.now(),by:me.email,x});if(S.log.length>200)S.log.shift()};
async function auth(f){const em=f.email.value.trim().toLowerCase(),pw=f.pw.value,h=await sha(pw);er='';
 if(mode==='login'){const u=U(em);if(!u||h!==cur(u))return bad('Conta não encontrada ou senha incorreta.');if(u.tf){pu=u;return render()}me=u}
 else{if(!/^[^@\s]+@gmail\.com$/.test(em))return bad('Use uma conta Google (@gmail.com).');if(U(em))return bad('Essa conta já existe. Faça login.');if(pw.length<8)return bad('Use uma senha com 8 ou mais caracteres.');
  me={email:em,name:f.nome.value.trim()||em.split('@')[0],role:'user',h,plan:'free',status:'ok',fr:[],sc:[]};S.users.push(me);save()}
 fin()}
function fin(){if(me.status==='banido'){me=null;return bad('Conta banida pela Staff.')}v='feed';render()}
async function a2(f){if(await totp(pu.tf)!==f.cod.value.trim())return bad('Código inválido.');me=pu;pu=null;fin()}
function login(){if(pu)return $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:8vh auto"><h3 style="margin:0">Verificação em duas etapas</h3><p class="mu">Digite o código de 6 dígitos do seu app autenticador.</p><form onsubmit="event.preventDefault();a2(this)"><input name="cod" inputmode="numeric" maxlength="6" required><br><br>${er?`<p style="color:#d83c3e">${esc(er)}</p>`:''}<button style="width:100%">Confirmar</button></form><p class="mu" style="text-align:center"><a onclick="pu=null;render()">Voltar</a></p></div>`;$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:8vh auto"><h2 style="margin:0">CO-OP</h2><p class="mu">Comunidades corporativas privadas</p>
<form onsubmit="event.preventDefault();auth(this)">${mode==='signup'?'<input name="nome" placeholder="Seu nome ou nome da empresa"><br><br>':''}<input name="email" type="email" placeholder="Conta Google (email)" required><br><br><input name="pw" type="password" placeholder="Senha" required><br><br>
${er?`<p style="color:#d83c3e">${esc(er)}</p>`:''}<button style="width:100%">${mode==='login'?'Entrar':'Criar conta com Google'}</button></form>
<p class="mu" style="text-align:center"><a onclick="mode=mode==='login'?'signup':'login';er='';render()">${mode==='login'?'Não tem conta? Criar conta':'Já tenho conta'}</a></p><p class="mu" style="text-align:center"><a onclick="pubm=true;render()">Ver publicações públicas</a></p><p class="mu">Protótipo: o login Google é simulado.</p></div>`}

const ub=()=>`<div class="ub">${av(me.email,32)}<span class="sp">${nm(null,me.email)}</span><button class="g" onclick="me=null;render()">Sair</button></div>`;
function rail(){const cs=S.coops.filter(canSee);
 return `<a class="tile ${v!=='coop'&&v!=='new'?'on':''}" title="Home" onclick="go('feed')">${IC.home}</a>${cs.map(c=>`<a class="tile ${v==='coop'&&cid===c.id?'on':''}" title="${esc(c.name)}" onclick="openC('${c.id}')">${c.pic?`<img src="${c.pic}" style="width:100%;height:100%;object-fit:cover">`:esc(c.name.slice(0,2))}</a>`).join('')}<a class="tile ${v==='new'?'on':''}" title="Criar CO-OP" onclick="go('new')">+</a><a class="tile tg" title="${PF.theme==='dark'?'Modo claro':'Modo noturno'}" onclick="setPF('theme',PF.theme==='dark'?'light':'dark')">${PF.theme==='dark'?IC.sun:IC.moon}</a><a class="tile" title="${PF.col?'Expandir aba lateral':'Recolher aba lateral'}" onclick="setPF('col',!PF.col)">${PF.col?IC.exp:IC.col}</a>`}
function sideH(){const it=(k,t)=>`<a class="it ${v===k&&(k!=='profile'||pe===me.email)?'on':''}" onclick="${k==='profile'?`openP('${me.email}')`:`go('${k}')`}">${t}</a>`;
 return `<div class="hd">Home</div><div class="sd">${it('feed','Home')}${it('profile','Meu perfil')}${it('plans','Assinaturas')}${it('cfg','Configurações')}${me.role==='staff'?it('staff','Painel Staff'):''}</div>${ub()}`}
function sideC(c){const a=adm(c);return `<div class="hd row">${cav(c,28)}<span>${esc(c.name)}</span></div><div class="sd"><div class="cap">Canais</div>${c.ch.map(h=>`<a class="it ${ch===h.id?'on':''}" onclick="ce=0;dl='';ch='${h.id}';render()"># ${esc(h.n)}</a>`).join('')}
${a?`<div class="row" style="padding:4px"><input id="nc" placeholder="novo canal"><button onclick="nch('${c.id}')">Criar</button></div>`:''}<div class="cap">Ferramentas</div>${[['gp','Perfil do grupo'],['tb','Tabelas'],['ag','Agenda'],['mb','Membros']].map(x=>`<a class="it ${ch===x[0]?'on':''}" onclick="ce=0;dl='';ch='${x[0]}';render()">${x[1]}</a>`).join('')}<div class="cap">Criptografia ponta a ponta (simulada)</div></div>${ub()}`}
function rtC(c){const g=(t,l)=>l.length?`<div class="cap">${t} - ${l.length}</div>`+l.map(e=>`<a class="row" style="padding:4px;color:var(--tx)" onclick="openP('${e}')">${av(e,28)}<span>${nm(c,e)}</span></a>`).join(''):'';
 return g('Administrador',[c.owner])+g('Moderadores',c.mods)+g('Membros',c.members.filter(e=>e!==c.owner&&!c.mods.includes(e)))}

function mainC(c){if(ch==='gp')return gp(c);if(ch==='tb')return tb(c);if(ch==='ag')return ag(c);if(ch==='mb')return mb(c);const h=c.ch.find(x=>x.id===ch)||c.ch[0];
 return `<div class="hd row"><span class="sp"># ${ce?`<input id="cr" value="${esc(h.n)}" style="width:60%">`:esc(h.n)}</span>${adm(c)?(ce?`<button onclick="rch('${c.id}','${h.id}')">Salvar</button><button class="g" onclick="ce=0;render()">Cancelar</button>`:`<button class="g" onclick="ce=1;render()">Editar canal</button>`)+(c.ch.length>1?`<button class="d" onclick="dch('${c.id}','${h.id}')">${dl===h.id?'Confirmar exclusão':'Excluir canal'}</button>`:''):''}</div><div class="ml" id="ml">${h.m.map(m=>`<div class="msg">${av(m.f)}<div><b>${nm(c,m.f)}</b> <span class="mu">${tm(m.t)}</span><div>${esc(m.x)}</div>${m.k==='image'?`<img class="m" src="${m.u}">`:m.k&&m.s!==SID?'<div class="mu">Mídia de uma sessão anterior</div>':m.k==='video'?`<video class="m" controls src="${m.u}"></video>`:m.k==='audio'?`<audio controls src="${m.u}"></audio>`:''}</div></div>`).join('')||'<p class="mu">Nenhuma mensagem neste canal ainda.</p>'}</div>
 <div class="cb"><div class="row"><input id="mx" placeholder="Mensagem em #${esc(h.n)}" onkeydown="if(event.key==='Enter')send('${c.id}','${h.id}')"><button onclick="send('${c.id}','${h.id}')">Enviar</button></div><div class="mu" style="margin-top:6px">Anexar foto, vídeo, música ou áudio de voz: <input type="file" accept="image/*,video/*,audio/*" style="width:auto;border:0;background:none;padding:0" onchange="pend=this.files[0]"></div></div>`}

 const done=()=>{h.m.push(m);save();render()};

function nt(id){const c=C(id),n=$('#tn').value.trim(),p=pl(U(c.owner));if(!n)return;if(c.tables.length>=p.t)return bad(`Plano ${p.n}: limite de ${p.t} tabelas. Faça upgrade para o Standard.`);c.tables.push({n,r:[['Item','Responsável','Status'],['','','']]});save();render()}
function ag(c){return `<div class="hd">Agenda</div><div class="bd2"><div class="card"><input id="et" placeholder="Compromisso"><br><br><input id="ed" type="datetime-local"><br><br><button onclick="ev('${c.id}')">Criar com lembrete</button></div>${c.ev.map(e=>`<div class="card row"><div><b>${esc(e.t)}</b><div class="mu">${esc(e.d.replace('T',' '))}</div></div><span class="sp"></span>${adm(c)?`<button class="g" onclick="C('${c.id}').ev=C('${c.id}').ev.filter(z=>z.id!=='${e.id}');save();render()">Excluir agenda</button>`:''}</div>`).join('')}</div>`}
function ev(id){const c=C(id),t=$('#et').value.trim(),d=$('#ed').value,p=pl(U(c.owner));if(!t||!d)return;if(c.ev.length>=p.a)return bad(`Plano ${p.n}: limite de ${p.a} agenda. Faça upgrade para o Standard.`);
 c.ev.push({id:'e'+Date.now(),t,d});save();render();const ms=new Date(d)-Date.now();if(ms>0&&ms<2e9)setTimeout(()=>{er='Lembrete: '+t;render()},ms)}
function mb(c){const kk=e=>e!==c.owner&&e!==me.email&&(me.role==='staff'||c.owner===me.email||(c.mods.includes(me.email)&&!c.mods.includes(e)));
 return `<div class="hd">Membros (${c.members.length}/${pl(U(c.owner)).m})</div><div class="bd2"><div class="card">${c.members.map(e=>`<div class="row msg">${av(e)}<span class="sp">${nm(c,e)}</span>${c.owner===me.email&&e!==me.email?`<button class="g" onclick="mod('${c.id}','${e}')">${c.mods.includes(e)?'Remover moderador':'Tornar moderador'}</button>`:''}${kk(e)?`<button class="g" onclick="kick('${c.id}','${e}')">Remover do grupo</button>`:''}</div>`).join('')}</div>
 ${adm(c)?`<div class="card row"><input id="ae" placeholder="Email Google do novo membro"><button onclick="addm('${c.id}')">Adicionar</button></div>`:''}</div>`}

function gp(c){const a=adm(c);return `<div class="hd">Perfil do grupo</div><div class="bd2"><div class="row">${cav(c,64)}<div class="sp"><h2 style="margin:0">${esc(c.name)}</h2><div class="mu">${c.members.length} membros</div></div></div><div class="card" style="margin-top:12px">${a?`<p>Foto do grupo <input type="file" accept="image/*" style="border:0;background:none" onchange="img(this.files[0],d=>{C('${c.id}').pic=d;save();render()})"></p><p class="mu">Nome<input id="gn" value="${esc(c.name)}"></p><p class="mu">Descrição<textarea id="gd">${esc(c.desc)}</textarea></p><p class="mu">Site ou LinkedIn da empresa<input id="gl" value="${esc(c.link)}"></p><button onclick="sgp('${c.id}')">Salvar</button>`:`<p>${esc(c.desc)||'<span class="mu">Sem descrição.</span>'}</p><p>${lk(c.link||'')}</p>`}</div></div>`}

function kick(id,e){const c=C(id);c.members=c.members.filter(x=>x!==e);c.mods=c.mods.filter(x=>x!==e);save();render()}
function addm(id){const c=C(id),e=$('#ae').value.trim().toLowerCase(),p=pl(U(c.owner));if(!U(e))return bad('Esse usuário ainda não tem conta.');if(c.members.includes(e))return;if(c.members.length>=p.m)return bad(`Plano ${p.n}: limite de ${p.m} membros. Faça upgrade.`);c.members.push(e);save();render()}

function fh(){const TR={},n=Date.now();S.posts.filter(p=>n-p.t<6048e5).forEach(p=>tags(p.x).forEach(t=>TR[t]=(TR[t]||0)+1+p.l.length+p.c.length));
 const top=Object.entries(TR).sort((a,b)=>b[1]-a[1]).slice(0,8),s2=p=>(p.l.length*3+p.c.length*4+(p.v||0)*.2+tags(p.x).reduce((a,t)=>a+(TR[t]||0),0)*.5+1)/Math.pow((n-p.t)/36e5+2,1.3);
 let L=S.posts.filter(p=>!ft||tags(p.x).includes(ft));L=fm==='top'?L.sort((a,b)=>s2(b)-s2(a)):L.sort((a,b)=>b.t-a.t);L=L.slice(0,30);let k=0;L.forEach(p=>{if(!seen.has(p.id)){seen.add(p.id);p.v=(p.v||0)+1;k=1}});if(k)save();
 return `<div class="tabs"><button class="${fm==='top'?'':'g'}" onclick="fm='top';render()">Em alta</button><button class="${fm==='new'?'':'g'}" onclick="fm='new';render()">Recentes</button>${top.map(([t,c])=>`<button class="${ft===t?'':'g'}" onclick="ht('${t}')">#${t} (${c})</button>`).join('')}${ft?`<button class="d" onclick="ht('')">Limpar #${esc(ft)}</button>`:''}</div>${L.map(pc).join('')||'<p class="mu">Nenhuma publicação encontrada.</p>'}`}
function feed(){return `<div class="hd">Home</div><div class="bd2"><div class="card"><textarea id="px" placeholder="Compartilhe uma novidade. Use #hashtags para ampliar o alcance"></textarea><div class="row" style="margin-top:8px"><input type="file" id="pf" accept="image/*" style="border:0;background:none"><span class="sp"></span><button onclick="post()">Publicar</button></div><p class="mu">Publicações da Home são públicas e aparecem na web, como no Instagram. O conteúdo dos CO-OPs continua privado.</p></div>${fh()}</div>`}
function pubv(){$('#app').innerHTML=`<div style="max-width:640px;margin:0 auto;padding:14px"><div class="row"><h2 class="sp" style="margin:0">CO-OP</h2><button onclick="pubm=false;render()">Entrar</button></div><p class="mu">Publicações públicas da Home. Entre para curtir, comentar e participar dos CO-OPs.</p>${fh()}</div>`}
function post(){if(!free())return;const x=$('#px').value.trim(),f=$('#pf').files[0],p={id:'p'+Date.now(),by:me.email,t:Date.now(),x,i:'',l:[],c:[]};if(!x&&!f)return;const d=()=>{S.posts.push(p);save();render()};f?img(f,u=>{p.i=u;d()}):d()}
const lk2=id=>{const p=S.posts.find(z=>z.id===id);p.l=p.l.includes(me.email)?p.l.filter(z=>z!==me.email):[...p.l,me.email];save();render()};

function prof(){const u=U(pe);if(!u)return '<div class="bd2">Perfil não encontrado.</div>';const own=u.email===me.email,isf=me.fr.includes(u.email);
 const T=[['recados','Recados'],['amigos','Amigos'],['sobre','Sobre'],['portfolio','Portfólio']];if(own)T.push(['editar','Editar perfil']);let b='';
 if(pt==='recados')b=`<div class="card"><textarea id="sc" placeholder="Deixe um recado para ${esc(u.name)}"></textarea><br><br><button onclick="scrap()">Deixar recado</button></div>${(u.sc||[]).slice().reverse().map(s=>`<div class="msg">${av(s.f)}<div><b>${nm(null,s.f)}</b> <span class="mu">${tm(s.t)}</span><div>${esc(s.x)}</div></div></div>`).join('')||'<p class="mu">Nenhum recado ainda.</p>'}`;
 if(pt==='amigos')b=(u.fr||[]).map(e=>`<a class="row msg" style="color:var(--tx)" onclick="openP('${e}')">${av(e)}<span>${nm(null,e)}</span></a>`).join('')||'<p class="mu">Nenhum amigo ainda.</p>';
 if(pt==='sobre')b=`<div class="card"><p>${esc(u.bio)||'<span class="mu">Sem biografia.</span>'}</p><p class="mu">Links</p><p>${lk(u.links||'')||'-'}</p><p class="mu">LinkedIn</p><p>${lk(u.linkedin||'')||'-'}</p><p class="mu">Currículo</p><p>${lk(u.cv||'')||'-'}</p><p class="mu">Telefone de contato</p><p>${esc(u.phone)||'-'}</p></div>`;
 if(pt==='portfolio')b=`<div class="card"><p>${esc(u.port)||'<span class="mu">Portfólio vazio.</span>'}</p><div class="gr">${S.posts.filter(p=>p.by===u.email&&p.i).map(p=>`<img src="${p.i}">`).join('')}</div></div>`;
 if(pt==='editar')b=`<div class="card"><p>Foto de perfil <input type="file" accept="image/*" style="border:0;background:none" onchange="img(this.files[0],d=>{me.pic=d;save();render()})"></p>${[['name','Nome'],['bio','Biografia'],['links','Links'],['linkedin','LinkedIn'],['cv','Currículo (link)'],['port','Portfólio (descrição)'],['phone','Telefone de contato']].map(f=>`<p class="mu">${f[1]}<input id="p_${f[0]}" value="${esc(me[f[0]])}"></p>`).join('')}<button onclick="['name','bio','links','linkedin','cv','port','phone'].forEach(k=>{const z=$('#p_'+k).value;if(k!=='name'||z.trim())me[k]=z});save();er='Perfil salvo.';render()">Salvar</button></div>`;
 return `<div class="hd">Perfil</div><div class="bd2"><div class="row">${av(u.email,64)}<div class="sp"><h2 style="margin:0">${nm(null,u.email)}</h2><div class="mu">${esc(u.bio||'')}</div></div>${own?'':`<button onclick="fr('${u.email}')">${isf?'Remover amigo':'Adicionar amigo'}</button>`}</div><div class="tabs">${T.map(t=>`<button class="${pt===t[0]?'':'g'}" onclick="pt='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}</div>`}

function plans(){const c=me.plan||'free',b=(k,t,s,l)=>`<div class="card"><h3 style="margin:0">${t}</h3><p class="mu">${s}</p><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul><button ${c===k?'disabled':''} onclick="me.plan='${k}';save();render()">${c===k?'Plano atual':'Escolher '+t}</button></div>`;
 return `<div class="hd">Assinaturas</div><div class="bd2"><div class="pl">${b('free','Free','Plano inicial, gratuito. Para conhecer o app.',['Até 10 membros','1 GB para fotos e vídeos','2 tabelas e 1 agenda'])}${b('basic','Basic','Semanal. Ideal para testar o app ou organizar um projeto rápido.',['Até 25 membros','5 GB para fotos e vídeos','4 tabelas e 2 agendas'])}${b('standard','Standard','Mensal ou anual. Para a empresa que decide ficar no app.',['Até 50 funcionários','10 GB de espaço','Tabelas e agendas ilimitadas'])}</div><p class="mu">Protótipo: a troca de plano é simulada, sem cobrança real.</p></div>`}
function rm(e){S.users=S.users.filter(u=>u.email!==e);S.users.forEach(u=>u.fr=(u.fr||[]).filter(x=>x!==e));S.coops=S.coops.filter(c=>{c.members=c.members.filter(x=>x!==e);c.mods=c.mods.filter(x=>x!==e);if(c.owner===e){const n=c.mods[0]||c.members[0];if(!n)return false;c.owner=n;c.mods=c.mods.filter(x=>x!==n)}return true});S.posts=S.posts.filter(p=>p.by!==e)}
function mig(a,b){const m=x=>x===a?b:x;S.users.forEach(u=>{if(u.email===a)u.email=b;u.fr=(u.fr||[]).map(m);(u.sc||[]).forEach(q=>q.f=m(q.f))});S.coops.forEach(c=>{c.owner=m(c.owner);c.mods=c.mods.map(m);c.members=c.members.map(m);c.ch.forEach(h=>h.m.forEach(q=>q.f=m(q.f)))});S.posts.forEach(p=>{p.by=m(p.by);p.l=p.l.map(m);p.c.forEach(q=>q.f=m(q.f))});if(pe===a)pe=b}
function staff(){if(me.role!=='staff')return '<div class="bd2">Acesso restrito à equipe de desenvolvimento.</div>';
 const T=[['users','Usuários'],['coops','CO-OPs'],['posts','Publicações'],['tk','Suporte ('+S.tk.filter(t=>!t.d).length+')'],['log','Auditoria']];
 return `<div class="hd">Painel Staff</div><div class="bd2"><p class="mu">${S.users.length} contas, ${S.users.filter(u=>u.status==='banido').length} banidas, ${S.coops.length} CO-OPs, ${S.posts.length} publicações</p><div class="tabs">${T.map(t=>`<button class="${sp===t[0]?'':'g'}" onclick="sp='${t[0]}';dl='';render()">${t[1]}</button>`).join('')}</div>${sl()}</div>`}
function ul(){const q=sq.toLowerCase();return S.users.filter(u=>u.role!=='staff'&&(u.name+' '+u.email).toLowerCase().includes(q)).map(u=>{const b=(a,t,c='g')=>`<button class="${c}" onclick="act('${u.email}','${a}')">${t}</button>`;return `<div class="card"><div class="row">${av(u.email)}<div class="sp"><b>${nm(null,u.email)}</b><div class="mu">${esc(u.email)} - ${u.status}${u.tf?' - 2FA':''}</div></div></div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="g" onclick="openP('${u.email}')">Ver perfil</button>${b('castigo','Castigo')}${b('banido','Banir')}${b('ok','Liberar')}${b('plan','Trocar plano')}${b('pw','Redefinir senha')}${u.tf?b('tf','Resetar 2FA'):''}${b('del',dl===u.email?'Confirmar exclusão':'Excluir','d')}</div></div>`}).join('')||'<p class="mu">Nenhum usuário encontrado.</p>'}

 if(sp==='coops')return S.coops.map(c=>`<div class="card row"><div class="sp"><b>${esc(c.name)}</b><div class="mu">Admin: ${esc((U(c.owner)||{}).name||c.owner)} - ${c.members.length} membros - ${c.ch.length} canais</div></div>${S.tk.some(t=>!t.d&&t.co===c.id)?`<button class="g" onclick="openC('${c.id}')">Abrir (chamado aberto)</button>`:'<span class="mu">Sem chamado aberto</span>'}<button class="d" onclick="dc('${c.id}')">${dl===c.id?'Confirmar exclusão':'Excluir'}</button></div>`).join('')||'<p class="mu">Nenhum CO-OP criado.</p>';
 if(sp==='posts')return S.posts.slice().reverse().map(p=>`<div class="card row"><div class="sp"><b>${nm(null,p.by)}</b><div class="mu">${tm(p.t)}</div>${esc(p.x.slice(0,140))}${p.i?' [foto]':''}</div><button class="d" onclick="S.posts=S.posts.filter(z=>z.id!=='${p.id}');lg('Removeu uma publicação');save();render()">Remover</button></div>`).join('')||'<p class="mu">Nenhuma publicação.</p>';
 if(sp==='tk')return S.tk.slice().reverse().map(t=>`<div class="card"><div class="sp"><b>${nm(null,t.by)}</b> <span class="mu">${tm(t.t)} - ${t.d?'resolvido':'aberto'}${t.sev?' - GRAVE':''}${t.co&&C(t.co)?' - CO-OP '+esc(C(t.co).name):''}</span><div>${esc(t.x)}</div></div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button onclick="tkc='${t.id}';render()">Abrir conversa</button><button class="g" onclick="tkx('${t.id}','d')">${t.d?'Reabrir':'Resolver'}</button><button class="g" onclick="tkx('${t.id}','sev')">${t.sev?'Remover marca de grave':'Marcar como grave'}</button></div></div>`).join('')||'<p class="mu">Nenhum chamado.</p>';
 return S.log.slice().reverse().map(l=>`<div class="msg"><div><span class="mu">${tm(l.t)}</span> ${esc(l.x)}</div></div>`).join('')||'<p class="mu">Sem registros.</p>'}
async function act(e,a){const u=U(e);if(!u||me.role!=='staff')return;
 if(a==='del'){if(dl!==e){dl=e;return render()}dl='';rm(e);lg('Excluiu a conta '+e)}
 else if(a==='plan'){const o=['free','basic','standard'];u.plan=o[(o.indexOf(u.plan||'free')+1)%3];lg('Plano de '+e+': '+u.plan)}
 else if(a==='pw'){const t=rs().slice(0,10);u.h=await sha(t);lg('Redefiniu a senha de '+e);er='Senha temporária de '+e+': '+t}
 else if(a==='tf'){u.tf='';lg('Resetou o 2FA de '+e)}
 else{u.status=a;lg('Marcou '+e+' como '+a)}
 save();render()}
function dc(id){if(dl!==id){dl=id;return render()}dl='';S.coops=S.coops.filter(c=>c.id!==id);lg('Excluiu um CO-OP');save();render()}
function cfg(){const b=(on,t,f)=>`<button class="${on?'':'g'}" onclick="${f}">${t}</button>`,st=me.role==='staff';return `<div class="hd">Configurações</div><div class="bd2"><div class="card"><h3 style="margin:0">Tema</h3><p class="mu">Escolha a aparência da tela.</p><div class="row">${b(PF.theme==='light','Claro',"setPF('theme','light')")}${b(PF.theme==='dark','Escuro (modo noturno)',"setPF('theme','dark')")}</div></div><div class="card"><h3 style="margin:0">Fundo animado</h3><p class="mu">Fumaça ciano em movimento. Desativado, o fundo fica liso: grafite no tema escuro e branco no claro.</p><div class="row">${b(PF.anim,'Ativado',"setPF('anim',true)")}${b(!PF.anim,'Desativado',"setPF('anim',false)")}</div></div>
<div class="card"><h3 style="margin:0">Segurança</h3><p class="mu">Autenticação em dois fatores (opcional)</p>${me.tf?`<p>Ativada.</p><button class="g" onclick="me.tf='';save();render()">Desativar 2FA</button>`:tsec?`<p class="mu">Adicione esta chave no seu app autenticador (Google Authenticator, por exemplo) e digite o código gerado.</p><p><b>${tsec}</b></p><div class="row"><input id="tc" placeholder="Código de 6 dígitos"><button onclick="f2()">Confirmar</button></div>`:`<button onclick="tsec=rs();render()">Ativar 2FA</button>`}
<p class="mu">Alterar senha (opcional)</p><input id="op" type="password" placeholder="Senha atual"><br><br><input id="np" type="password" placeholder="Nova senha"><br><br><button onclick="cp()">Alterar senha</button>
${st?'':`<p class="mu">Alterar email (opcional)</p><input id="ne" type="email" placeholder="Novo email Google"><br><br><input id="pe2" type="password" placeholder="Senha atual"><br><br><button onclick="ce2()">Alterar email</button>`}</div>
<div class="card"><h3 style="margin:0">Suporte</h3><br><textarea id="tk" placeholder="Descreva seu problema para a equipe"></textarea><br><br><select id="tco"><option value="">Chamado geral (sem CO-OP)</option>${S.coops.filter(c=>c.members.includes(me.email)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><br><br><button onclick="tkt()">Enviar ao suporte</button>${S.tk.filter(t=>t.by===me.email).map(t=>`<div class="row msg"><span class="sp">${esc(t.x.slice(0,50))} <span class="mu">${t.d?'resolvido':'aberto'}</span></span><button class="g" onclick="tkc='${t.id}';render()">Abrir conversa</button></div>`).join('')}</div>
${st?'':`<div class="card"><h3 style="margin:0">Excluir conta</h3><p class="mu">Remove sua conta e suas publicações. CO-OPs que você administra passam para um moderador ou membro.</p><button class="d" onclick="dme()">${dl==='me'?'Confirmar exclusão da conta':'Excluir minha conta'}</button></div>`}</div>`}
async function f2(){if(await totp(tsec)!==$('#tc').value.trim())return bad('Código inválido.');me.tf=tsec;tsec='';save();bad('Autenticação em dois fatores ativada.')}
async function cp(){const h=await sha($('#op').value),n=$('#np').value;if(h!==cur(me))return bad('Senha atual incorreta.');if(n.length<8)return bad('A nova senha precisa ter 8 ou mais caracteres.');me.h=await sha(n);save();bad('Senha alterada.')}
async function ce2(){const n=$('#ne').value.trim().toLowerCase();if(await sha($('#pe2').value)!==cur(me))return bad('Senha atual incorreta.');if(!/^[^@\s]+@gmail\.com$/.test(n))return bad('Use uma conta Google (@gmail.com).');if(U(n))return bad('Esse email já está em uso.');mig(me.email,n);save();bad('Email alterado.')}
const tkt=()=>{const x=$('#tk').value.trim();if(!x)return;const id='t'+Date.now();S.tk.push({id,by:me.email,x,t:Date.now(),d:0,co:$('#tco').value,m:[{f:me.email,x,t:Date.now()}]});tkc=id;save();render()};
function tkx(id,k){const t=S.tk.find(z=>z.id===id);if(k==='d'){t.d=t.d?0:1;lg('Chamado '+(t.d?'resolvido':'reaberto'))}else{t.sev=t.sev?0:1;lg(t.sev?'Chamado marcado como grave (possível encaminhamento jurídico)':'Marca de grave removida')}save();render()}
function pop(){const t=S.tk.find(z=>z.id===tkc);if(!t||!me)return '';return `<div class="pop"><div class="row hd"><span class="sp">Suporte${t.sev?' (grave)':''}</span><button class="g" onclick="tkc='';render()">Fechar</button></div><div class="pm" id="pm">${t.m.map(q=>`<div class="msg">${av(q.f,26)}<div><b>${nm(null,q.f)}</b><div>${esc(q.x)}</div></div></div>`).join('')}</div><div class="row" style="padding:8px"><input id="pi" placeholder="Escreva uma mensagem" onkeydown="if(event.key==='Enter')ps()"><button onclick="ps()">Enviar</button></div></div>`}
function ps(){const t=S.tk.find(z=>z.id===tkc),x=$('#pi').value.trim();if(!t||!x)return;t.m.push({f:me.email,x,t:Date.now()});save();render()};
function dme(){if(dl!=='me'){dl='me';return render()}rm(me.email);me=null;dl='';save();render()}
function render(){const a=$('#app');if(!me||me.status==='banido'){me=null;a.className='';return pubm?pubv():login()}me.fr=me.fr||[];if(v==='staff'&&me.role!=='staff')v='feed';if(v==='coop'&&!(C(cid)&&canSee(C(cid))))v='feed';
 const c=v==='coop'?C(cid):null;a.className='g'+(PF.col?' cl':'')+(c?'':' nr');let side,main,rt='';
 if(c){side=sideC(c);main=mainC(c);rt=rtC(c)}else{side=sideH();main=({feed,new:nw,profile:prof,plans,staff,cfg})[v]()}
 a.innerHTML=`<div class="rail">${rail()}</div><div class="side">${side}</div><div class="main">${er?`<div class="er">${esc(er)}</div>`:''}${main}</div><div class="rt">${rt}</div>${pop()}`;er='';
 const m=$('#mx');if(m&&!tkc)m.focus();const l=$('#ml');if(l)l.scrollTop=l.scrollHeight;const pi=$('#pi');if(pi)pi.focus();const pm=$('#pm');if(pm)pm.scrollTop=pm.scrollHeight}
document.addEventListener('wheel',e=>{const r=e.target.closest&&e.target.closest('.rail');if(r&&r.scrollWidth>r.clientWidth&&r.scrollHeight<=r.clientHeight){r.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
applyPF();render();
</script></body></html>
