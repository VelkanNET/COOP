async function createSuffix(){const label=$('#suffix_name')?.value.trim(),color=$('#suffix_color')?.value;if(!label||label.length>18)return bad('O nome do sufixo deve ter entre 1 e 18 caracteres.');try{await window.coopFirebase.saveSuffix({id:crypto.randomUUID(),label,color});er='Sufixo criado.'}catch(error){er='Não foi possível criar o sufixo: '+error.message}render()}

function ul(){const q=sq.toLowerCase();return S.users.filter(u=>u.role!=='staff'&&(u.name+' '+u.email).toLowerCase().includes(q)).map(u=>{const b=(a,t,c='g')=>`<button class="${c}" onclick="act('${u.email}','${a}')">${t}</button>`;return `<div class="card"><div class="row">${av(u.email)}<div class="sp"><b>${nm(null,u.email)}</b><div class="mu">${esc(u.email)} - ${esc(u.status||'ok')}</div></div></div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="g" onclick="openP('${u.email}')">Ver perfil</button>${b('castigo','Castigo')}${b('banido','Banir')}${b('ok','Liberar')}${b('plan','Trocar plano')}${b('del',dl===u.email?'Confirmar exclusão':'Excluir','d')}</div></div>`}).join('')||'<p class="mu">Nenhum usuário encontrado.</p>'}
function sl(){if(sp==='suffixes')return suffixesAdmin();if(sp==='users')return `<input placeholder="Buscar usuário por nome ou email" value="${esc(sq)}" oninput="sq=this.value;$('#ul').innerHTML=ul()"><div id="ul" style="margin-top:10px">${ul()}</div>`;
 if(sp==='coops')return S.coops.map(c=>`<div class="card row"><div class="sp"><b>${esc(c.name)}</b><div class="mu">Admin: ${esc((U(c.owner)||{}).name||c.owner)} - ${c.members.length} membros - ${c.ch.length} canais</div></div>${S.tk.some(t=>!t.d&&t.co===c.id)?`<button class="g" onclick="openC('${c.id}')">Abrir (chamado aberto)</button>`:'<span class="mu">Sem chamado aberto</span>'}<button class="d" onclick="dc('${c.id}')">${dl===c.id?'Confirmar exclusão':'Excluir'}</button></div>`).join('')||'<p class="mu">Nenhum CO-OP criado.</p>';
 if(sp==='posts')return S.posts.slice().reverse().map(p=>`<div class="card row"><div class="sp"><b>${nm(null,p.by)}</b><div class="mu">${tm(p.t)}</div>${esc(p.x.slice(0,140))}${p.i?' [foto]':''}</div><button class="d" onclick="staffDelete('posts','${p.id}')">Remover</button></div>`).join('')||'<p class="mu">Nenhuma publicação.</p>';
 if(sp==='tk')return S.tk.slice().reverse().map(t=>`<div class="card"><div class="sp"><b><a onclick="openP('${t.email||''}')">${nm(null,t.email||t.by)}</a></b> <span class="mu">${tm(t.t)} - ${t.d?'resolvido':'aberto'}${t.sev?' - GRAVE':''}${t.co&&C(t.co)?' - CO-OP '+esc(C(t.co).name):''}</span><div>${esc(t.x)}</div></div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button onclick="tkc='${t.id}';render()">Abrir conversa</button><button class="g" onclick="tkx('${t.id}','d')">${t.d?'Reabrir':'Resolver'}</button><button class="g" onclick="tkx('${t.id}','sev')">${t.sev?'Remover marca de grave':'Marcar como grave'}</button></div></div>`).join('')||'<p class="mu">Nenhum chamado.</p>';
 return S.log.slice().reverse().map(l=>`<div class="msg"><div><span class="mu">${tm(l.t)}</span> ${esc(l.action||l.x||'')}</div></div>`).join('')||'<p class="mu">Sem registros.</p>'}
async function act(e,a){const u=U(e);if(!u||me.role!=='staff')return;let action=a,value;
 if(a==='del'){if(dl!==e){dl=e;return render()}const confirmation=prompt(`Para excluir permanentemente, digite ${e}`);if(confirmation!==e){dl='';return bad('Exclusão cancelada: confirmação não corresponde ao email.')}action='delete';dl=''}
 else if(a==='plan'){const plans=['free','basic','standard'];value=plans[(plans.indexOf(u.plan||'free')+1)%plans.length];action='plan'}
 else {action='status';value=a}
 try{await window.coopFirebase.staffCall('/api/staff/user',{uid:u.uid,action,value,confirmation:a==='del'?e:undefined});er=a==='plan'?`Plano atualizado para ${value}.`:a==='del'?'Conta excluída permanentemente.':'Ação aplicada à conta.'}
 catch(error){er='Não foi possível concluir a ação: '+error.message}render()}
async function staffDelete(collection,id){try{await window.coopFirebase.staffCall('/api/staff/delete',{collection,id});er='Registro excluído.'}catch(error){er='Não foi possível excluir: '+error.message}render()}
async function dc(id){if(dl!==id){dl=id;return render()}dl='';await staffDelete('coops',id)}
function cfg(){const b=(on,t,f)=>`<button class="${on?'':'g'}" onclick="${f}">${t}</button>`,st=me.role==='staff';return `<div class="hd">Configurações</div><div class="bd2"><div class="card"><h3 style="margin:0">Tema</h3><p class="mu">Escolha a aparência da tela.</p><div class="row">${b(PF.theme==='light','Claro',"setPF('theme','light')")}${b(PF.theme==='dark','Escuro (modo noturno)',"setPF('theme','dark')")}</div></div><div class="card"><h3 style="margin:0">Fundo animado</h3><p class="mu">Fumaça ciano em movimento. Desativado, o fundo fica liso: grafite no tema escuro e branco no claro.</p><div class="row">${b(PF.anim,'Ativado',"setPF('anim',true)")}${b(!PF.anim,'Desativado',"setPF('anim',false)")}</div></div>
<div class="card"><h3 style="margin:0">Conta e segurança</h3><p>Login, email, senha e autenticação em duas etapas são gerenciados com segurança pela sua conta Google. Este aplicativo não armazena nem simula credenciais.</p><a href="https://myaccount.google.com/security" target="_blank" rel="noopener noreferrer">Abrir configurações de segurança do Google</a><p class="mu">Conta conectada: ${esc(me.email)}</p></div>
<div class="card"><h3 style="margin:0">Suporte</h3><br><textarea id="tk" maxlength="5000" placeholder="Descreva seu problema para a equipe"></textarea><br><br><select id="tco"><option value="">Chamado geral (sem CO-OP)</option>${S.coops.filter(c=>c.members.includes(me.email)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><br><br><button onclick="tkt()">Enviar ao suporte</button>${S.tk.filter(t=>t.by===me.uid).map(t=>`<div class="row msg"><span class="sp">${esc(t.x.slice(0,50))} <span class="mu">${t.d?'resolvido':'aberto'}</span></span><button class="g" onclick="tkc='${t.id}';render()">Abrir conversa</button></div>`).join('')}</div>
${st?'':`<div class="card"><h3 style="margin:0">Excluir conta</h3><p class="mu">A exclusão remove permanentemente seu perfil, publicações, relações de seguidores e chamados. A administração de CO-OPs será transferida quando houver outro membro.</p><button class="d" onclick="dme()">Excluir minha conta</button></div>`}<footer class="card" style="text-align:center;margin-top:24px"><h2 style="margin:0">CO-OP</h2><p class="mu">© ${new Date().getFullYear()} CO-OP. Todos os direitos reservados.</p></footer></div>`}
async function tkt(){const x=$('#tk').value.trim();if(!x)return bad('Descreva o problema antes de enviar.');try{tkc=await window.coopFirebase.createTicket({x,co:$('#tco').value});er='Chamado enviado ao suporte.'}catch(error){er='Não foi possível enviar o chamado: '+error.message}render()}
async function tkx(id,k){const t=S.tk.find(z=>z.id===id);if(!t)return;try{await window.coopFirebase.staffCall('/api/staff/ticket',{id,action:k==='d'?'status':'severity',value:k==='d'?(t.d?'open':'resolved'):!t.sev});er='Chamado atualizado.'}catch(error){er='Não foi possível atualizar o chamado: '+error.message}render()}
function pop(){const t=S.tk.find(z=>z.id===tkc);if(!t||!me)return '';return `<div class="pop"><div class="row hd"><span class="sp">Suporte${t.sev?' (grave)':''}</span><button class="g" onclick="tkc='';render()">Fechar</button></div><div class="pm" id="pm">${(t.m||[]).map(q=>`<div class="msg"><a onclick="openP('${q.f}')">${av(q.f,26)}</a><div><b><a onclick="openP('${q.f}')">${nm(null,q.f)}</a></b><div>${esc(q.x)}</div></div></div>`).join('')}</div><div class="row" style="padding:8px"><input id="pi" maxlength="5000" placeholder="Escreva uma mensagem" onkeydown="if(event.key==='Enter')ps()"><button onclick="ps()">Enviar</button></div></div>`}
async function ps(){const t=S.tk.find(z=>z.id===tkc),x=$('#pi').value.trim();if(!t||!x)return;try{await window.coopFirebase.addTicketMessage(t.id,x)}catch(error){er='Não foi possível enviar a resposta: '+error.message}render()}
async function dme(){if(!confirm('Excluir permanentemente sua conta e os dados relacionados? Esta ação não pode ser desfeita.'))return;const confirmation=prompt(`Digite ${me.email} para confirmar`);if(confirmation!==me.email)return bad('Exclusão cancelada: confirmação não corresponde ao email.');try{await window.coopFirebase.deleteAccount(confirmation);me=null;S={users:[],coops:[],posts:[],tk:[],log:[]};await window.coopFirebase.signOut();er='Conta excluída.'}catch(error){er='Não foi possível excluir a conta: '+error.message}render()}
function render(){const a=$('#app');if(!me||me.status==='banido'){stopCoopWatchers();if(assetCacheUserUid){clearPrivateAssetCache();assetCacheUserUid=''}me=null;a.className='';return pubm?pubv():login()}if(assetCacheUserUid&&assetCacheUserUid!==me.uid)clearPrivateAssetCache();assetCacheUserUid=me.uid;visibleProfileEmails=new Set();trimFollowWatches();me.fr=me.fr||[];if(v==='staff'&&me.role!=='staff')v='feed';if(v==='coop'&&!(C(cid)&&canSee(C(cid))))v='feed';
 const c=v==='coop'?C(cid):null;if(!c&&coopWatchKey)stopCoopWatchers();a.className='g'+(PF.col?' cl':'')+(c?'':' nr');let side,main,rt='';
 if(c){side=sideC(c);main=mainC(c);rt=rtC(c)}else{side=sideH();main=({feed,new:nw,profile:prof,plans,staff,cfg})[v]()}
 a.innerHTML=`<div class="rail">${rail()}</div><div class="side">${side}</div><div class="main">${er?`<div class="er">${esc(er)}</div>`:''}${main}</div><div class="rt">${rt}</div>${pop()}`;trimUserProfileWatches();er='';
 const m=$('#mx');if(m&&!tkc)m.focus();const l=$('#ml');if(l)l.scrollTop=l.scrollHeight;const pi=$('#pi');if(pi)pi.focus();const pm=$('#pm');if(pm)pm.scrollTop=pm.scrollHeight}
document.addEventListener('wheel',e=>{const r=e.target.closest&&e.target.closest('.rail');if(r&&r.scrollWidth>r.clientWidth&&r.scrollHeight<=r.clientHeight){r.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
applyPF();render();window.coopFirebaseReady.then(()=>window.coopFirebase.watchAuth(cloudAuthChanged)).catch(e=>{authReady=true;er='Falha ao inicializar o Firebase: '+e.message;render()});
</script></body></html>
